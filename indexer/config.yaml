# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Rackrate indexer (Envio HyperIndex). Addresses are the Monad testnet deployment in contracts/deployments/10143.json.
# Series contracts and their Kuru books are discovered from SeriesCreated / MarketCreated (contractRegister).
name: rackrate
address_format: lowercase
# Every history row links to its transaction, so the hash is fetched for all events.
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: SeriesFactory
    handler: src/EventHandlers.ts
    events:
      - event: "SeriesCreated(address indexed series, bytes32 indexed feedId, uint64 startEpoch, uint64 endEpoch, uint64 floor, uint64 cap, bool isDemo, address long, address short)"
  - name: Series
    handler: src/EventHandlers.ts
    events:
      - event: "Minted(address indexed account, uint256 units, uint256 collateralIn)"
      - event: "PairRedeemed(address indexed account, uint256 units, uint256 collateralOut)"
      - event: "Settled(uint8 kind, uint64 settlementPrice, uint256 printed, uint256 total)"
      - event: "Claimed(address indexed account, uint256 longUnits, uint256 shortUnits, uint256 collateralOut)"
  - name: MarketRegistry
    handler: src/EventHandlers.ts
    events:
      - event: "MarketCreated(address indexed series, address indexed book, address indexed long, bytes32 feedId)"
  - name: KuruBook
    handler: src/EventHandlers.ts
    events:
      # Kuru OrderBook fill event, confirmed against a real fill's log (topic0 0xf16924fb...).
      - event: "Trade(uint40 orderId, address makerAddress, bool isBuy, uint256 price, uint96 updatedSize, address takerAddress, address txOrigin, uint96 filledSize)"
  - name: HedgeRouter
    handler: src/EventHandlers.ts
    events:
      - event: "Hedged(address indexed account, address indexed series, uint256 units, uint256 collateralIn, uint256 proceeds)"
      - event: "LongBought(address indexed account, address indexed book, uint256 quoteIn, uint256 longOut)"
  - name: RackOracle
    handler: src/EventHandlers.ts
    events:
      - event: "EpochFinalized(bytes32 indexed feedId, uint64 indexed epoch, uint8 status, uint64 price, uint8 submissions)"
chains:
  - id: 10143 # Monad testnet
    start_block: 67475432 # RackOracle / SeriesFactory deployment
    contracts:
      - name: SeriesFactory
        address: "0x750d1B8550704a8452C8db17Ba53352C8c28aDF4"
      - name: MarketRegistry
        address: "0x7BFefe8EeFC2F73148950dd876870AB4FEC774e5"
      - name: HedgeRouter
        address: "0xE5eB6018cedC90204a7b27fF5dF083Dfa781226C"
      - name: RackOracle
        address: "0x495231539161D0e8e3f9b509e70Cc5aB2b4120dc"
      - name: Series
      - name: KuruBook
